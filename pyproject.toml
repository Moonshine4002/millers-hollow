[project]
name = "millers-hollow"
version = "2.0.0"
description = "The Werewolves of Miller's Hollow with LLM AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.109.1",
    "ollama>=0.6.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/millers_hollow"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
exclude = [".legacy"]
